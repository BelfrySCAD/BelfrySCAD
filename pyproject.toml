[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "belfryscad"
version = "1.39.0"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "PySide6",
    "manifold3d",
    "moderngl",
    "numpy",
    "setproctitle>=1.3.7",
    "openscad_cpp_evaluator>=1.25.0",
    "certifi",
    "keyring>=25.0",
    # .openscad_mdimggen_rc is real YAML and this project does not own the
    # format -- see docsgen/mdimggen.py's _rc_defaults.
    "PyYAML>=6.0",
]

[project.scripts]
belfryscad = "belfryscad.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/belfryscad"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "briefcase>=0.4.5",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]

# ---------------------------------------------------------------------------
# Briefcase packaging
# ---------------------------------------------------------------------------

[tool.briefcase]
project_name = "BelfrySCAD"
bundle = "com.belfrydw"
version = "1.39.0"
description = "Hybrid OpenSCAD + WYSIWYG procedural CAD system"
author = "Revar Desmera"
author_email = "revarbat@gmail.com"
url = "https://www.github.com/BelfrySCAD/BelfrySCAD"

[tool.briefcase.app.belfryscad]
formal_name = "BelfrySCAD"
description = "Hybrid OpenSCAD + WYSIWYG procedural CAD system"
icon = "resources/belfryscad"
sources = ["src/belfryscad"]
requires = [
    "PySide6",
    "manifold3d",
    "moderngl",
    "numpy",
    "setproctitle>=1.3.7",
    "openscad_cpp_evaluator>=1.25.0",
    "certifi",
    "keyring>=25.0",
]

[tool.briefcase.app.belfryscad.document_type.scad]
extension = "scad"
description = "OpenSCAD File"
icon = "resources/belfryscad"
url = "https://openscad.org"
mime_type = "text/x-openscad"

[tool.briefcase.app.belfryscad.document_type.scad.macOS]
CFBundleTypeRole = "Editor"
LSHandlerRank = "Alternate"
UTTypeConformsTo = ["public.plain-text", "public.source-code"]

[tool.briefcase.app.belfryscad.macOS]
# openscad_cpp_evaluator's compiled wheel requires macOS 13.3+ (its parser
# submodule uses std::to_chars for floats, unavailable below that in
# Apple's libc++) -- BelfrySCAD can no longer claim 12.0 as its floor.
min_os_version = "13.3"
universal_build = false

[tool.briefcase.app.belfryscad.windows]
installer_type = "msi"
# Pin the install to per-machine instead of asking. Unset, briefcase emits
# WiX's `perUserOrMachine` -- ALLUSERS=2 with MSIINSTALLPERUSER=1 -- and
# Windows treats a per-user and a per-machine install as two separate
# products that never replace each other. That is the only known mechanism
# that produces the stacked installs of #411. The dialog is also not
# trustworthy as it stands: elevated, ALLUSERS=2 resolves to per-machine, so
# "just for me" does not reliably mean what it says.
system_installer = true
# Install to C:\Program Files\BelfrySCAD, not
# C:\Program Files\Revar Desmera\BelfrySCAD. The template wraps the app
# folder in one named after `author` unless this is off, and a vendor folder
# for a single app is a surprise nobody asked for. The Manufacturer
# shown in Programs and Features is unaffected -- that comes from `author`
# either way.
use_full_install_path = false

[tool.briefcase.app.belfryscad.linux.appimage]
manylinux = "manylinux_2_28"

[tool.briefcase.app.belfryscad.linux.flatpak]
flatpak_runtime = "org.freedesktop.Platform"
flatpak_runtime_version = "24.08"
flatpak_sdk = "org.freedesktop.Sdk"

# Briefcase's defaults are close but wrong in two places for this app.
#
# It grants xdg-documents/xdg-data/xdg-config/xdg-cache, which covers the
# library folder (~/.local/share/OpenSCAD/libraries) but not a script that
# says import("../parts/bracket.stl"). A path written in source was never
# chosen in a file dialog, so no portal can authorise it -- the model simply
# fails to render, pointing at a file the user can see in their terminal.
finish_arg."filesystem=home" = true

# And it forces XWayland (socket=x11 + nosocket=wayland). PySide6's Linux
# wheel does ship libqwayland.so and libqt-plugin-wayland-egl.so, so the
# native path exists; XWayland costs fractional-scale displays a blurry
# upscale and weakens trackpad gesture delivery, both of which this app
# cares about. fallback-x11 keeps X11-only systems working unchanged.
#
# moderngl attaches to Qt's own GL context here (viewport.py's
# create_context() has no standalone=True), so EGL-under-Wayland needs no
# code change; the GLX/EGL fallback in headless_render.py is the separate
# standalone path.
finish_arg."socket=wayland" = true
finish_arg."socket=fallback-x11" = true
finish_arg."nosocket=wayland" = false
finish_arg."socket=x11" = false
