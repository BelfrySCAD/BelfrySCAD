name: Release

on:
  # Manually runnable so a packaging change can be proven before a tag is
  # cut. The release and publish jobs are all tag-only, so a dispatch run
  # builds Windows, Linux and the sdist/wheel, and publishes nothing.
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      - run: uv sync --frozen --python 3.12

      - name: Build Windows installer
        run: |
          uv run --python 3.12 briefcase create windows app
          uv run --python 3.12 briefcase build windows app
          uv run --python 3.12 briefcase package windows app

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: windows-x86_64
          path: dist/*.msi

  build-linux:
    # x86_64 only. An aarch64 AppImage was tried and does not work:
    #
    #   * PySide6's only Linux ARM wheel is manylinux_2_39_aarch64, so the
    #     container has to be manylinux_2_39 -- the 2.28 image this project
    #     otherwise uses contains no installable PySide6 at all.
    #   * moderngl and glcontext publish no aarch64 wheels whatsoever, so
    #     that container then has to compile them, and it has no clang++.
    #   * briefcase's AppImage template has no system_requires step, no env
    #     hook and no package step, so there is no supported way to put a
    #     compiler in it.
    #
    # Linux ARM is therefore a source install needing a C++ toolchain, not
    # a packaging target. Revisit if moderngl ships aarch64 wheels.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libegl1-mesa-dev

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      - run: uv sync --frozen --python 3.12

      - name: Build Linux AppImage
        run: |
          uv run --python 3.12 briefcase create linux appimage
          uv run --python 3.12 briefcase build linux appimage
          uv run --python 3.12 briefcase package linux appimage

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: linux-x86_64
          path: dist/*.AppImage

  build-pypi:
    # Pure Python -- one sdist and one py3-none-any wheel, so no matrix.
    # Runs on workflow_dispatch as well, to prove the sdist/wheel still
    # build; the publish jobs below are the tag-only part.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      - run: uv build

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: pypi-dist
          path: dist/*

  publish-testpypi:
    needs: [build-pypi]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # The pypi environment, not a separate testpypi one: one environment to
    # create, and one environment name to enter on both indexes' trusted
    # publisher forms. Its required-reviewer rule therefore gates this job
    # too, so a tag waits for approval twice.
    environment: pypi
    # OIDC trusted publishing: no API token is stored anywhere. id-token
    # write is what mints the short-lived OIDC credential, and job-level
    # permissions replace the workflow-level block wholesale rather than
    # adding to it, so contents has to be restated.
    #
    # openscad_cpp_evaluator uses token auth instead, because PyPI's
    # trusted-publisher matcher does not yet recognise GitHub's immutable
    # subject claims, emitted with no opt-out by repos created after
    # 2026-07-15. That repo was created 2026-07-24; this one 2026-06-24, so
    # it predates the change and matches the way PyPI still expects.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: pypi-dist
          path: dist

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
          # TestPyPI is a dry run we may re-upload to under one version while
          # fixing a packaging problem. Never set this on publish-pypi -- a
          # real PyPI filename collision must fail loudly, not skip silently.
          skip-existing: true

  publish-pypi:
    needs: [publish-testpypi]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # Requires a "pypi" GitHub Environment with a required-reviewer rule, so
    # this pauses for manual approval once TestPyPI has been eyeballed. A
    # PyPI upload cannot be undone or replaced at the same version.
    environment: pypi
    # OIDC trusted publishing -- see the comment on publish-testpypi above.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: pypi-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  release:
    needs: [build-windows, build-linux, build-pypi]
    # Only a tag publishes. A workflow_dispatch run exists to prove the
    # builds still work, and must not create a release.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: true
