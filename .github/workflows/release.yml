name: Release

on:
  # Manually runnable so a packaging change can be proven before a tag is
  # cut. The release job itself is tag-only, so a dispatch run builds
  # every platform and publishes nothing.
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      - run: uv sync --frozen --python 3.12

      - name: Build macOS app
        run: |
          uv run --python 3.12 briefcase create macOS app
          uv run --python 3.12 briefcase build macOS app
          uv run --python 3.12 briefcase package macOS app --adhoc-sign

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: macos-arm64
          path: dist/*.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      - run: uv sync --frozen --python 3.12

      - name: Build Windows installer
        run: |
          uv run --python 3.12 briefcase create windows app
          uv run --python 3.12 briefcase build windows app
          uv run --python 3.12 briefcase package windows app

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: windows-x86_64
          path: dist/*.msi

  build-linux:
    # x86_64 only. An aarch64 AppImage was tried and does not work:
    #
    #   * PySide6's only Linux ARM wheel is manylinux_2_39_aarch64, so the
    #     container has to be manylinux_2_39 -- the 2.28 image this project
    #     otherwise uses contains no installable PySide6 at all.
    #   * moderngl and glcontext publish no aarch64 wheels whatsoever, so
    #     that container then has to compile them, and it has no clang++.
    #   * briefcase's AppImage template has no system_requires step, no env
    #     hook and no package step, so there is no supported way to put a
    #     compiler in it.
    #
    # Linux ARM is therefore a source install needing a C++ toolchain, not
    # a packaging target. Revisit if moderngl ships aarch64 wheels.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libegl1-mesa-dev

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      - run: uv sync --frozen --python 3.12

      - name: Build Linux AppImage
        run: |
          uv run --python 3.12 briefcase create linux appimage
          uv run --python 3.12 briefcase build linux appimage
          uv run --python 3.12 briefcase package linux appimage

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: linux-x86_64
          path: dist/*.AppImage

  release:
    needs: [build-macos, build-windows, build-linux]
    # Only a tag publishes. A workflow_dispatch run exists to prove the
    # builds still work, and must not create a release.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: true
