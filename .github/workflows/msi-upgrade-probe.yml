# Diagnostic only: reproduces #411 on a real Windows box.
#
# The reporter installs "for all users" every time, so the per-user versus
# per-machine explanation is out -- two same-scope installs still stack, and
# Programs and Features ends up listing both. Nothing about that can be
# checked from macOS, and the MSI tables have looked correct every time they
# were read statically, so the question is what Windows Installer actually
# does at run time.
#
# Never runs on its own: dispatch it, read the summary, throw it away when
# #411 is closed.
name: MSI upgrade probe

on:
  workflow_dispatch:
    inputs:
      old_version:
        description: "Version to install first (no leading v)"
        default: "1.18.6"
      new_version:
        description: "Version to install over it"
        default: "1.23.2"
      old_scope:
        description: "Scope for the first install"
        type: choice
        default: "default"
        options: ["default", "perMachine", "perUser"]
      new_scope:
        description: "Scope for the second install"
        type: choice
        default: "default"
        options: ["default", "perMachine", "perUser"]

jobs:
  probe:
    runs-on: windows-latest
    steps:
      # The package ships ALLUSERS=2 with MSIINSTALLPERUSER=1, which is WiX
      # for "per-user unless told otherwise". "default" therefore passes
      # nothing and takes whatever a click-through user would get.
      - name: Scope arguments
        id: scope
        run: |
          function Args($scope) {
            switch ($scope) {
              "perMachine" { return 'ALLUSERS=1 MSIINSTALLPERUSER=""' }
              "perUser"    { return 'ALLUSERS=2 MSIINSTALLPERUSER=1' }
              default      { return '' }
            }
          }
          "old=$(Args '${{ inputs.old_scope }}')" >> $env:GITHUB_OUTPUT
          "new=$(Args '${{ inputs.new_scope }}')" >> $env:GITHUB_OUTPUT
          Write-Host "old scope args: $(Args '${{ inputs.old_scope }}')"
          Write-Host "new scope args: $(Args '${{ inputs.new_scope }}')"

      - uses: actions/checkout@v5

      - name: Download both MSIs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v${{ inputs.old_version }}" -p "*.msi" -D old
          gh release download "v${{ inputs.new_version }}" -p "*.msi" -D new
          Get-ChildItem old, new | Format-Table Name, Length

      - name: Install the old version (${{ inputs.old_scope }})
        run: |
          $msi = (Get-ChildItem old/*.msi)[0].FullName
          $a = @("/i","`"$msi`"","/qn") + `
               ("${{ steps.scope.outputs.old }}".Split(" ") | Where-Object { $_ }) + `
               @("/l*v","$PWD\old-install.log")
          $p = Start-Process msiexec -Wait -PassThru -ArgumentList $a
          Write-Host "exit=$($p.ExitCode)"
          if ($p.ExitCode -ne 0) { Get-Content old-install.log -Tail 40; exit 1 }

      - name: State after the first install
        run: ./.github/scripts/msi_state.ps1 -Label "after ${{ inputs.old_version }}"

      - name: Install the new version over it (${{ inputs.new_scope }})
        run: |
          $msi = (Get-ChildItem new/*.msi)[0].FullName
          $a = @("/i","`"$msi`"","/qn") + `
               ("${{ steps.scope.outputs.new }}".Split(" ") | Where-Object { $_ }) + `
               @("/l*v","$PWD\new-install.log")
          $p = Start-Process msiexec -Wait -PassThru -ArgumentList $a
          Write-Host "exit=$($p.ExitCode)"
          if ($p.ExitCode -ne 0) { Get-Content new-install.log -Tail 40; exit 1 }

      - name: State after the upgrade -- the actual question
        run: ./.github/scripts/msi_state.ps1 -Label "after ${{ inputs.new_version }}" -Verdict

      - name: What the installer decided about the older product
        run: |
          Write-Host "=== lines naming the upgrade actions ==="
          Select-String -Path new-install.log `
            -Pattern "FindRelatedProducts|RemoveExistingProducts|MigrateFeatureStates|Found related product|Upgrade code|ActionProperty|Disallowing installation|SELMGR" `
            | ForEach-Object { $_.Line.Trim() } | Select-Object -First 60

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: msi-logs
          path: "*.log"
