name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  platforms:
    # macOS and Windows were only ever built by release.yml, which runs
    # briefcase but never pytest -- so the suite had never run on either,
    # on a project mostly developed on macOS. macos-latest is arm64, which
    # also gives the .3mf export that ARM platforms gained when lib3mf was
    # dropped its first real coverage.
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide the result on the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Install Qt/GL dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libgl1-mesa-dri

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv sync --frozen

      - run: uv run pytest

  # Branch protection requires a check called exactly "test". A matrix job
  # reports as "test (ubuntu-latest)" and friends, so a job of that name
  # would never produce the required check and every PR would sit BLOCKED
  # with all three platforms green -- which is precisely what happened.
  # This gate keeps that name stable however the matrix changes.
  test:
    needs: platforms
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check every platform passed
        run: |
          if [ "${{ needs.platforms.result }}" != "success" ]; then
            echo "platform matrix: ${{ needs.platforms.result }}"
            exit 1
          fi
          echo "all platforms passed"
