<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Wall-eyed stereo: two side-by-side views, and two eyes looking
       straight ahead, each at the view on its own side. Cross-eyed is the
       same picture with the lines of sight crossed. -->
  <g fill="none" stroke="#444" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <rect x="2.5" y="3.5" width="11" height="9" rx="1"/>
    <rect x="18.5" y="3.5" width="11" height="9" rx="1"/>
    <line x1="8.5" y1="23" x2="8.5" y2="14.5" stroke-width="1.5" stroke-dasharray="2 2"/>
    <line x1="23.5" y1="23" x2="23.5" y2="14.5" stroke-width="1.5" stroke-dasharray="2 2"/>
  </g>
  <circle cx="8.5" cy="26.5" r="2.75" fill="#444"/>
  <circle cx="23.5" cy="26.5" r="2.75" fill="#444"/>
</svg>
