<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Left view: a cube as the isometric view shows it, with the
       left face filled. That face is hidden, so its edges are dashed. -->
  <polygon points="5,10 16,4 16,16 5,22" fill="#444" fill-opacity="0.6" stroke="none"/>
  <g fill="none" stroke="#444" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <polygon points="16,4 27,10 27,22 16,28 5,22 5,10"/>
    <g stroke-dasharray="2,2" stroke-width="1.5">
      <line x1="16" y1="16" x2="16" y2="4"/>
      <line x1="16" y1="16" x2="5" y2="22"/>
      <line x1="16" y1="16" x2="27" y2="22"/>
    </g>
  </g>
</svg>
