  <g fill="none" stroke="#444" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <polygon points="16,4 27,10 27,22 16,28 5,22 5,10"/>
    <polyline points="5,10 16,16 27,10"/>
    <line x1="16" y1="16" x2="16" y2="28"/>
  </g>
</svg>
