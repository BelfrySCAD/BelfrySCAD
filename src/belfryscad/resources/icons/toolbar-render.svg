<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Render: the script (a page of code) becomes a solid, a shaded sphere
       beside Preview's dotted hollow one. A sphere, not a cube, so it is not
       taken for the cube of the Perspective button. -->
  <!-- the body is ink, the highlight white (never recoloured), so the
       sphere stays convex in dark mode, where the ink turns light -->
  <defs>
    <radialGradient id="shine" cx="0.35" cy="0.33" r="0.6">
      <stop offset="0" stop-color="white" stop-opacity="0.85"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g fill="none" stroke="#444" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10.5 27 L5 27 Q4 27 4 26 L4 4 Q4 3 5 3 L16 3 L21 8" stroke-width="2.2"/>
    <path d="M16 3 L16 8 L21 8" stroke-width="2.2"/>
    <line x1="8" y1="11" x2="14" y2="11" stroke-width="2"/>
    <line x1="8" y1="16" x2="10" y2="16" stroke-width="2"/>
    <line x1="8" y1="21" x2="9" y2="21" stroke-width="2"/>
    <circle cx="20.5" cy="20.5" r="10" fill="#444" fill-opacity="0.6" stroke-width="2"/>
    <circle cx="20.5" cy="20.5" r="9" fill="url(#shine)" stroke="none"/>
  </g>
</svg>
