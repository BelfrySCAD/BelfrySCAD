<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Render: the script (a page of code) becomes a solid (the cube). -->
  <g fill="none" stroke="#444" stroke-linecap="round" stroke-linejoin="round">
    <!-- page with folded corner, open at the bottom-right where the cube sits -->
    <path d="M14 27 L5 27 Q4 27 4 26 L4 4 Q4 3 5 3 L16 3 L21 8 L21 13" stroke-width="2.2"/>
    <path d="M16 3 L16 8 L21 8" stroke-width="2.2"/>
    <!-- code lines -->
    <line x1="8" y1="11" x2="14" y2="11" stroke-width="2"/>
    <line x1="8" y1="16" x2="12" y2="16" stroke-width="2"/>
    <line x1="8" y1="21" x2="11" y2="21" stroke-width="2"/>
    <!-- cube overlapping the corner -->
    <polygon points="23,14 16,18 16,26 23,30 30,26 30,18" stroke-width="2"/>
    <line x1="16" y1="18" x2="23" y2="22" stroke-width="2"/>
    <line x1="30" y1="18" x2="23" y2="22" stroke-width="2"/>
    <line x1="23" y1="22" x2="23" y2="30" stroke-width="2"/>
  </g>
</svg>
