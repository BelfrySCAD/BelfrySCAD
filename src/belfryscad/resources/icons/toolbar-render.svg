<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Render: the same cone in front of a sphere, solid and shaded, as the
       model exports. The sphere's fill stops at the cone's edge, so the
       half-transparent ink never doubles up. The body is ink and the
       highlight white (never recoloured), so both stay convex in dark mode,
       where the ink turns light. -->
  <defs>
    <radialGradient id="ball" cx="0.4" cy="0.3" r="0.6">
      <stop offset="0" stop-color="white" stop-opacity="0.85"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="white" stop-opacity="0"/>
      <stop offset="0.35" stop-color="white" stop-opacity="0.8"/>
      <stop offset="0.75" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g stroke="#444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13.22 12.57 A8.5 8.5 0 1 1 16.3 21.23 Z" fill="#444" fill-opacity="0.6" stroke="none"/>
    <path d="M13.22 12.57 A8.5 8.5 0 1 1 16.3 21.23 Z" fill="url(#ball)" stroke="none"/>
    <path d="M13.22 12.57 A8.5 8.5 0 1 1 16.3 21.23" fill="none"/>
    <path d="M2 26.0 L10.0 3.5 L18 26.0 A8.0 2.6 0 0 1 2 26.0 Z" fill="#444" fill-opacity="0.6" stroke="none"/>
    <path d="M2 26.0 L10.0 3.5 L18 26.0 A8.0 2.6 0 0 1 2 26.0 Z" fill="url(#cone)" stroke="none"/>
    <path d="M2 26.0 L10.0 3.5 L18 26.0 A8.0 2.6 0 0 1 2 26.0" fill="none"/>
  </g>
</svg>
